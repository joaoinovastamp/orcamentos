<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1F3864">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%231F3864%27/%3E%3Ctext x=%2732%27 y=%2743%27 font-size=%2730%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27Arial%27 font-weight=%27bold%27%3EOR%3C/text%3E%3C/svg%3E">
<title>INOVASTAMP Orçamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --azul:#1F3864; --azul2:#2E5597; --fundo:#F3F5F9; --cartao:#fff; --txt:#1c2330; --mut:#6b7385; --linha:#e3e7ef;
          --verde:#1E8E5A; --amarelo:#FFF6C2; --verm:#C0392B; --laranja:#D9822B; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--fundo); color:var(--txt); font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--azul); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:17px; margin:0; flex:1; font-weight:600; }
  header button { background:rgba(255,255,255,.15); color:#fff; border:0; border-radius:8px; padding:6px 10px; font-size:14px; }
  main { padding:12px 12px 90px; max-width:720px; margin:0 auto; }
  nav { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--linha); display:flex; z-index:6; padding-bottom:env(safe-area-inset-bottom); }
  nav button { flex:1; min-width:0; border:0; background:none; padding:9px 0 8px; font-size:12px; color:var(--mut); display:flex; flex-direction:column; align-items:center; gap:2px; }
  nav button b { font-size:19px; line-height:1; }
  nav button.on { color:var(--azul); font-weight:600; }
  .card { background:var(--cartao); border-radius:12px; padding:12px 14px; margin-bottom:10px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .row { display:flex; gap:8px; align-items:center; }
  .sp { flex:1; min-width:0; }
  .mut { color:var(--mut); font-size:13px; }
  .num { font-variant-numeric:tabular-nums; }
  .b { font-weight:600; }
  .tag { display:inline-block; padding:2px 8px; border-radius:20px; font-size:12px; font-weight:600; background:#e9edf5; color:var(--azul); white-space:nowrap; }
  .t-Rascunho{background:#eceff3;color:#56607a} .t-Enviado{background:#e3eefc;color:#2259a8} .t-Aceite{background:#e2f5ea;color:#1E8E5A}
  .t-Recusado{background:#fbe5e3;color:#C0392B} .t-Emprodução{background:#fff0dd;color:#b4651a} .t-Faturado{background:#1E8E5A;color:#fff}
  input,select,textarea { width:100%; font:inherit; padding:9px 10px; border:1px solid var(--linha); border-radius:8px; background:#fff; color:var(--txt); }
  input:focus,select:focus,textarea:focus { outline:2px solid var(--azul2); border-color:transparent; }
  label { display:block; font-size:12px; color:var(--mut); margin:8px 0 3px; }
  .g2 { display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
  .g3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 8px; }
  .btn { border:0; border-radius:10px; padding:11px 14px; font:inherit; font-weight:600; background:var(--azul); color:#fff; }
  .btn.sec { background:#e6ebf4; color:var(--azul); }
  .btn.ok { background:var(--verde); }
  .btn.lite { background:none; color:var(--azul2); padding:6px 4px; font-weight:500; }
  .btn:disabled { opacity:.5; }
  .acts { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .acts .btn { flex:1; }
  .chips { display:flex; gap:6px; overflow-x:auto; padding:4px 0 8px; }
  .chip { border:1px solid var(--linha); background:#fff; border-radius:20px; padding:5px 11px; font-size:13px; white-space:nowrap; color:var(--txt); }
  .chip.on { background:var(--azul); color:#fff; border-color:var(--azul); }
  h2 { font-size:15px; margin:14px 2px 8px; color:var(--azul); }
  .lin { border-top:1px solid var(--linha); padding:8px 0; }
  .lin:first-child { border-top:0; }
  .tot { display:flex; justify-content:space-between; padding:3px 0; }
  .tot.big { font-size:17px; font-weight:700; color:var(--azul); border-top:1px solid var(--linha); margin-top:4px; padding-top:7px; }
  .stk { color:var(--verde); font-weight:600; font-size:12px; }
  .prod-btn { text-align:left; background:var(--amarelo); border:1px solid #eadb85; border-radius:8px; padding:9px 10px; width:100%; font:inherit; color:var(--txt); }
  .x { border:0; background:none; color:var(--verm); font-size:20px; padding:0 4px; }
  #modal { position:fixed; inset:0; background:rgba(15,22,40,.45); z-index:20; display:none; }
  #modal .box { position:absolute; left:0; right:0; bottom:0; top:8%; background:#fff; border-radius:16px 16px 0 0; display:flex; flex-direction:column; }
  #modal .hd { padding:12px; border-bottom:1px solid var(--linha); display:flex; gap:8px; }
  #modal .bd { overflow-y:auto; flex:1; }
  .grp { position:sticky; top:0; background:#eef1f7; padding:6px 12px; font-size:12px; font-weight:700; color:var(--azul); }
  .it { padding:8px 12px; border-bottom:1px solid #f0f2f6; font-size:14px; display:flex; gap:10px; align-items:center; }
  .ft { width:44px; height:44px; object-fit:contain; border-radius:6px; background:#f3f5f9; flex:none; }
  .ft.g { width:84px; height:84px; }
  .it:active { background:#eef3ff; }
  #load { position:fixed; inset:0; background:rgba(255,255,255,.6); z-index:30; display:none; align-items:center; justify-content:center; }
  .spin { width:38px; height:38px; border:4px solid #cfd8ea; border-top-color:var(--azul); border-radius:50%; animation:r 0.8s linear infinite; }
  @keyframes r { to { transform:rotate(360deg); } }
  #msg { position:fixed; left:12px; right:12px; bottom:76px; z-index:40; background:#1c2330; color:#fff; padding:11px 14px; border-radius:10px; display:none; white-space:pre-line; font-size:14px; }
  #msg.err { background:var(--verm); }
  .vazio { text-align:center; color:var(--mut); padding:30px 10px; }
  details summary { color:var(--azul2); font-size:13px; margin-top:8px; }
  .lucro { background:#eef8f2; border:1px solid #cfe9da; }
  .lucro.mau { background:#fdf0ee; border-color:#f3c9c3; }
  .alerta { color:var(--verm); font-weight:600; font-size:13px; }
  .ok-t { color:var(--verde); font-weight:600; font-size:12px; }
  .btn.wa { background:#25D366; }
  .kpi { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .kpi .card { margin:0; }
  .kpi .v { font-size:18px; font-weight:700; color:var(--azul); }
  .cv { width:100%; touch-action:none; border-radius:12px; background:#fff; display:block; }
  .g4 { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:0 6px; }
  table.sim { width:100%; border-collapse:collapse; font-size:13px; } table.sim td, table.sim th { padding:4px 3px; text-align:right; border-bottom:1px solid var(--linha); }
  table.sim th { color:var(--mut); font-weight:600; } table.sim td:first-child, table.sim th:first-child { text-align:left; }
  .sel { display:flex; gap:8px; align-items:center; border-top:1px solid var(--linha); padding:7px 0; }
</style>
</head>
<body>
<header><h1 id="titulo">Orçamentos</h1><button id="btnTopo" onclick="recarregar()">↻</button></header>
<main id="main"></main>
<nav>
  <button id="n-lista" onclick="irLista()"><b>☰</b>Orçamentos</button>
  <button id="n-novo" onclick="novo()"><b>＋</b>Novo</button>
  <button id="n-cons" onclick="irConsulta()"><b>€</b>Consulta</button>
  <button id="n-enc" onclick="irEncomendas()"><b>⇪</b>Encomendas</button>
  <button id="n-res" onclick="irResumo()"><b>▤</b>Resumo</button>
  <button id="n-maq" onclick="irMaquete()"><b>✎</b>Maquete</button>
</nav>
<div id="modal"><div class="box"><div class="hd"><input id="mq" placeholder="Procurar produto ou referência…" oninput="filtrarModal()"><button class="btn sec" onclick="fecharModal()">Fechar</button></div><div class="bd" id="mbd"></div></div></div>
<div id="load"><div class="spin"></div></div>
<div id="msg"></div>

<script>
var D = null, LISTA = [], FILTRO = 'Todos', BUSCA = '', ED = null, CALC = null, PICK = null, STOCK = null;
var STK = '★ ', SEP = ' ▸ ';

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function eur(v) { if (v === '' || v == null || isNaN(v)) return '—'; return Number(v).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' €'; }
function pct(v) { return v === '' || v == null ? '' : Math.round(Number(v) * 1000) / 10 + '%'; }
function dt(s) { var m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '/' + m[2] + '/' + m[1] : ''; }
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function base(ref) { var s = String(ref || ''); var i = s.indexOf(' ('); return (i > 0 ? s.substring(0, i) : s).toUpperCase(); }
function limpaProd(t) { t = String(t || ''); return t.indexOf(STK) === 0 && t.indexOf(SEP) > 0 ? t.substring(t.indexOf(SEP) + SEP.length) : t; }
function limpaCor(t) { t = String(t || ''); return t.indexOf(STK) === 0 ? t.substring(STK.length).replace(/ — \d+ em stock$/, '') : t; }
function foto(ref, grande) {
  var k = base(ref).replace(/[^A-Z0-9_-]/g, '_'), u = D && D.fotos ? D.fotos[k] : '';
  return u ? '<img class="ft' + (grande ? ' g' : '') + '" loading="lazy" src="' + esc(u) + '" onerror="this.style.visibility=\'hidden\'">' : '<div class="ft' + (grande ? ' g' : '') + '"></div>';
}
function nomeCurto(lab) { var i = lab.indexOf(' — '); return i > 0 ? lab.substring(i + 3) : lab; }

function msg(t, err) { var m = $('msg'); m.textContent = t; m.className = err ? 'err' : ''; m.style.display = 'block'; clearTimeout(msg.t); msg.t = setTimeout(function () { m.style.display = 'none'; }, err ? 7000 : 3500); }
function carregando(on) { $('load').style.display = on ? 'flex' : 'none'; }
var PIN = '', GPIN = '';
try { PIN = localStorage.getItem('inovastamp_pin') || ''; GPIN = localStorage.getItem('inovastamp_gestor') || ''; } catch (e) {}
function gestor() { return !!GPIN; }
var MARGEM_ALERTA = 0.25;
var API = 'https://script.google.com/macros/s/AKfycby0OuenHSPaxgmop0q1uMh_Y3OxLCV4KYdx8WnrP76cjZiPFaEZFXrYqXw42jdv3qhwrg/exec';
function call(fn) {
  var args = [PIN].concat(Array.prototype.slice.call(arguments, 1));
  carregando(true);
  function falha(t) {
    carregando(false);
    if (String(t).indexOf('CODIGO_ERRADO') >= 0) { try { localStorage.removeItem('inovastamp_pin'); } catch (x) {} PIN = ''; entrar('Código errado.'); }
    else msg(t, true);
  }
  return new Promise(function (ok, ko) {
    fetch(API, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }), credentials: 'omit', redirect: 'follow' })
      .then(function (r) { return r.json(); })
      .then(function (r) { if (r && r.ok) { carregando(false); ok(r.result); } else { falha(r && r.error ? r.error : 'Erro desconhecido'); ko(r); } })
      .catch(function (e) { falha('Sem ligação à folha. Verifica a internet e tenta outra vez.'); ko(e); });
  });
}
// PDF: vem pela app (funciona com qualquer conta, sem precisar de acesso ao Drive)
function abrirPdf(num) {
  var w = null;
  call('apiPdf', num).then(function (r) {
    var bin = atob(r.b64), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([a], { type: 'application/pdf' }));
    var l = document.createElement('a'); l.href = url; l.download = r.nome; l.target = '_blank';
    document.body.appendChild(l); l.click(); l.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  });
}
function navOn(id) { ['n-lista','n-novo','n-cons','n-enc','n-res','n-maq'].forEach(function (n) { $(n).className = n === id ? 'on' : ''; }); window.scrollTo(0, 0); }

// ---------------- arranque ----------------
var ABRIR_OP = (function () { try { return new URLSearchParams(location.search).get('op') || ''; } catch (e) { return ''; } })(), OP_FOCO = false;
function iniciar() {
  if (!PIN) { entrar(); return; }
  call('apiInit').then(function (d) {
    D = d;
    if (ABRIR_OP) { var n = ABRIR_OP; ABRIR_OP = ''; try { history.replaceState(null, '', location.pathname); } catch (e) {} OP_FOCO = true; abrir(n); }
    else irLista(true);
  });
}
function js(v) { return esc(JSON.stringify(v)); }
// fornecedores (aba Fornecedores da folha): etiqueta no nome do produto → fornecedor; sem etiqueta = Velilla
function fornecedores() { return D && D.fornecedores && D.fornecedores.length ? D.fornecedores : [{ nome: 'Velilla', tag: '' }, { nome: 'Roly', tag: '· Roly' }]; }
function fornDe(lab) { var t = String(lab || ''), f = fornecedores().filter(function (x) { return x.tag && t.indexOf(x.tag) >= 0; })[0]; return f ? f.nome : 'Velilla'; }
// custos das calculadoras (DTF e serigrafia) guardados na folha (aba Custos Personalização)
var CUSTOS_OK = false, _gc = {};
function carregarCustos(cb) {
  if (CUSTOS_OK) { cb(); return; }
  call('apiCustosPers').then(function (c) {
    CUSTOS_OK = true;
    ['preco', 'rolo', 'gap', 'aplic', 'margem', 'inteiros'].forEach(function (k) { if (c.dtf && c.dtf[k] !== undefined) DTF[k] = c.dtf[k]; });
    Object.keys(SERI.p).forEach(function (k) { if (c.seri && c.seri[k] !== undefined) SERI.p[k] = c.seri[k]; });
    cb();
  }, function () { CUSTOS_OK = true; cb(); });
}
function guardarCustosNuvem(g, obj) {
  clearTimeout(_gc[g]);
  _gc[g] = setTimeout(function () { fetch(API, { method: 'POST', body: JSON.stringify({ fn: 'apiCustosPersGuardar', args: [PIN, g, obj] }), credentials: 'omit', redirect: 'follow' }).catch(function () {}); }, 1200);
}
function entrar(erro) {
  $('titulo').textContent = 'INOVASTAMP';
  $('main').innerHTML = '<div class="card" style="margin-top:30px"><div class="b" style="font-size:17px">Código da app</div>' +
    '<div class="mut">Escreve o código definido na folha (INOVASTAMP › Definir código da app). Só é pedido uma vez neste telemóvel.</div>' +
    (erro ? '<div style="color:var(--verm);margin-top:8px">' + esc(erro) + '</div>' : '') +
    '<input id="pin" type="password" autocomplete="current-password" style="margin-top:12px" onkeydown="if(event.key===\'Enter\')okPin()">' +
    '<div class="acts"><button class="btn" onclick="okPin()">Entrar</button></div></div>';
  setTimeout(function () { var p = $('pin'); if (p) p.focus(); }, 50);
}
function okPin() {
  var p = $('pin').value.trim(); if (!p) return;
  PIN = p;
  call('apiEntrar').then(function () { try { localStorage.setItem('inovastamp_pin', p); } catch (e) {} iniciar(); });
}
function recarregar() { D = null; STOCK = null; iniciar(); }

// ---------------- lista ----------------
function irLista(rec) {
  navOn('n-lista'); $('titulo').textContent = 'Orçamentos';
  if (rec || !LISTA.length) call('apiLista').then(function (l) { LISTA = l; desenharLista(); }); else desenharLista();
}
function desenharLista() {
  var est = ['Todos'].concat(D.estados);
  var h = separadores('lista') + '<input id="busca" placeholder="Procurar cliente ou nº…" value="' + esc(BUSCA) + '" oninput="BUSCA=this.value;desenharItens()">' +
    '<div class="chips">' + est.map(function (e) { return '<button class="chip' + (e === FILTRO ? ' on' : '') + '" onclick="FILTRO=\'' + e + '\';desenharLista()">' + esc(e) + '</button>'; }).join('') + '</div><div id="itens"></div>';
  $('main').innerHTML = h; desenharItens();
}
function desenharItens() {
  var q = norm(BUSCA);
  var l = LISTA.filter(function (o) { return (FILTRO === 'Todos' || o.estado === FILTRO) && (!q || norm(o.cliente + ' ' + o.num + ' ' + o.fatura).indexOf(q) >= 0); });
  $('itens').innerHTML = l.length ? l.map(function (o) {
    return '<div class="card" onclick="abrir(\'' + esc(o.num) + '\')"><div class="row"><div class="sp"><div class="b">' + esc(o.cliente || '—') + '</div>' +
      '<div class="mut">' + esc(o.num) + ' · ' + dt(o.data) + ' · ' + (o.qtd || 0) + ' pç' + (o.fatura ? ' · Fat. ' + esc(o.fatura) : '') + '</div></div>' +
      '<div style="text-align:right"><div class="b num">' + eur(o.tC) + '</div><span class="tag t-' + esc(o.estado.replace(/\s/g, '')) + '">' + esc(o.estado || '—') + '</span></div></div></div>';
  }).join('') : '<div class="vazio">Sem orçamentos.</div>';
}

// ---------------- detalhe ----------------
var ATUAL = null;
function abrir(num) { call('apiAbrir', num).then(function (o) { ATUAL = o; desenharDetalhe(o); }); }
// lucro (só no modo gestor): total s/ IVA − custo das peças (a personalização não tem custo registado)
function blocoLucro(totS, linhas, calc) {
  if (!gestor()) return '';
  var custo = 0;
  linhas.forEach(function (l, i) { var c = calc ? calc[i] : l; custo += (Number(c && c.custo) || 0) * (Number(l.qtd) || 0); });
  var lucro = Math.round((totS - custo) * 100) / 100, p = totS ? lucro / totS : 0, mau = p < MARGEM_ALERTA;
  return '<div class="card lucro' + (mau ? ' mau' : '') + '"><div class="mut">🔒 Só no modo gestor</div>' +
    '<div class="tot"><span>Custo das peças</span><span class="num">' + eur(custo) + '</span></div>' +
    '<div class="tot big"><span>Lucro bruto</span><span class="num">' + eur(lucro) + ' · ' + pct(p) + '</span></div>' +
    (mau ? '<div class="alerta">⚠ Margem abaixo de ' + pct(MARGEM_ALERTA) + ' do total s/ IVA.</div>' : '') +
    '<div class="mut">Sem o custo da personalização (tinta, DTF, mão de obra).</div></div>';
}
function desenharDetalhe(o) {
  navOn('n-lista'); $('titulo').textContent = o.num;
  var h = '<div class="card"><div class="row"><div class="sp"><div class="b" style="font-size:17px">' + esc(o.cliente) + '</div>' +
    '<div class="mut">' + (o.nif ? 'NIF ' + esc(o.nif) + ' · ' : '') + esc(o.email || 'sem email') + (o.tel ? ' · ' + esc(o.tel) : '') + '</div>' +
    '<div class="mut">' + dt(o.data) + ' · validade ' + esc(o.validade) + ' dias' + (o.desconto ? ' · desconto ' + pct(o.desconto) : '') + '</div></div>' +
    '<span class="tag t-' + esc(o.estado.replace(/\s/g, '')) + '">' + esc(o.estado) + '</span></div></div>';
  h += '<div class="card">' + o.linhas.map(function (l) {
    return '<div class="lin row" style="align-items:flex-start">' + foto(l.ref) + '<div class="sp"><div class="b">' + esc(nomeCurto(l.produto)) + '</div><div class="mut">' + esc(l.ref) + ' · ' + esc(l.cor || 'sem cor') +
      (l.pers1 ? ' · ' + esc(l.pers1) : '') + (l.pers2 ? ' + ' + esc(l.pers2) : '') + '</div>' +
      (l.tam ? '<div class="mut">Tamanhos: ' + esc(l.tam) + '</div>' : '') +
      '<div class="row num"><span class="sp">' + l.qtd + ' × ' + eur(l.unitC) + '</span><b>' + eur(l.totC) + '</b></div></div></div>';
  }).join('') + '<div class="tot big"><span>Total c/ IVA</span><span class="num">' + eur(o.tC) + '</span></div>' +
    '<div class="tot mut"><span>Total s/ IVA</span><span class="num">' + eur(o.tS) + '</span></div></div>';
  h += blocoLucro(o.tS, o.linhas);
  var n = JSON.stringify(o.num).replace(/"/g, '&quot;');
  h += '<div class="acts">' + (o.pdf ? '<button class="btn sec" onclick="abrirPdf(' + n + ')">Abrir PDF</button>' : '') +
    '<button class="btn" onclick="enviar(' + n + ',' + JSON.stringify(o.email || '').replace(/"/g, '&quot;') + ')">Enviar por email</button></div>' +
    (o.pdf ? '<div class="acts"><button class="btn wa" onclick="whatsapp(' + n + ')">WhatsApp</button></div><div id="waZona"></div>' : '') +
    '<div class="acts"><button class="btn sec" onclick="editar(' + n + ')">Editar</button><button class="btn sec" onclick="duplicar()">Duplicar</button>' +
    '<button class="btn sec" onclick="fichaCliente(ATUAL.cliente, ATUAL.nif)">Ficha do cliente</button></div>' +
    '<div class="acts"><button class="btn sec" onclick="maqueteDoOrc()">✎ Maquete deste orçamento</button></div>';

// tamanhos: lê "S:2 M:5 L:3" (ou "2S 5M") e confere com a quantidade
function lerTam(t) {
  var s = String(t || '').toUpperCase().replace(/[;,]/g, ' ').replace(/\s+/g, ' ').trim(), out = [], m;
  var T = '\\d{1,2}\\/\\d{1,2}|[2-6]XL|XXXL|XXL|XL|XXS|XS|S|M|L|U|\\d{2}';
  var A = '(' + T + ')\\s?[:=]?\\s?(\\d{1,4})', B = '(\\d{1,4})\\s?(' + T + ')';
  var semG = function (x) { return x.replace(/\((?!\?)/g, '(?:'); };
  var tA = new RegExp('^(?:' + semG(A) + '(?:\\s|$))+$'), tB = new RegExp('^(?:' + semG(B) + '(?:\\s|$))+$');
  var inv = !tA.test(s) && tB.test(s), re = new RegExp((inv ? B : A) + '(?=\\s|$)', 'g');
  while ((m = re.exec(s)) !== null) out.push(inv ? { tam: m[2], qtd: Number(m[1]) } : { tam: m[1], qtd: Number(m[2]) });
  return out;
}
function infoTam(l) {
  if (!l.tam) return '';
  var t = lerTam(l.tam), soma = t.reduce(function (a, x) { return a + x.qtd; }, 0);
  if (!t.length) return '<div class="alerta">Não percebi os tamanhos. Escreve assim: S:2 M:5 L:3</div>';
  if (l.qtd && soma !== Number(l.qtd)) return '<div class="alerta">Os tamanhos somam ' + soma + ' pç e a quantidade é ' + l.qtd + '.</div>';
  return '<div class="ok-t">✓ ' + t.map(function (x) { return x.tam + ': ' + x.qtd; }).join(' · ') + '</div>';
}

  if (guardar && !forcar && ['Aceite', 'Em produção'].indexOf(ED.estado) >= 0 && ED.numero) {
    var v = confirm('Este orçamento já estava ' + ED.estado + '.\nOK = volta a "Enviado" (o cliente aceita de novo a versão alterada).\nCancelar = mantém "' + ED.estado + '".');
    if (v) { ED.estado = 'Enviado'; var se = $('eEst'); if (se) se.value = 'Enviado'; }
  }
  call('apiCalcular', payload(forcar), guardar).then(function (r) {
    if (!r.ok && r.ocupado) { if (confirm(r.msg + '\n\nContinuar?')) calcular(guardar, true); return; }
    if (!r.ok) { msg(r.msg, true); return; }
    ED.numero = r.numero; CALC = r; $('titulo').textContent = (r.guardado ? '' : 'Rascunho ') + r.numero;
    desenharLinhas(); desenharTotais();
    if (r.guardado) {
      LISTA = []; STOCK = null;
      if (r.estado) { ED.estado = r.estado; $('eEst').value = r.estado; }
      msg('Guardado: ' + r.numero + (r.cliMsg ? ' · ' + r.cliMsg : '') + (r.msgs && r.msgs.length ? '\n' + r.msgs.join('\n') : ''));
      $('eDepois').innerHTML = '<div class="acts">' + (r.pdf ? '<button class="btn sec" onclick="abrirPdf(\'' + esc(r.numero) + '\')">Abrir PDF</button>' : '') +
        '<button class="btn" onclick="enviar(\'' + esc(r.numero) + '\',\'' + esc(ED.email) + '\')">Enviar por email</button></div>' +
        '<div class="acts"><button class="btn sec" onclick="abrir(\'' + esc(r.numero) + '\')">Ver orçamento (WhatsApp, encomenda…)</button></div>';
      call('apiInit').then(function (d) { D = d; });
    }
  });
}

function novaEnc(forn) { EN = { num: '', forn: forn, obs: '', data: D.hoje, estado: '', linhas: [] }; desenharEnc(); encAdicionar(); }
function abrirEnc(num) {
  call('apiEncAbrir', num).then(function (o) {
    EN = { num: o.num, forn: o.forn, obs: o.obs, data: o.data, estado: o.estado, envio: o.envio, total: o.total, pdf: o.pdf, email: o.email,
           linhas: o.linhas.map(function (l) { return { produto: l.produto, ref: l.ref, cor: l.cor, tam: l.tam, qtd: l.qtd, nota: l.nota, preco: l.preco, total: l.total }; }) };
    desenharEnc();

}
function tamanhosDe(ref) { if (!TAMS) return []; return TAMS[ref] || TAMS[base(ref)] || TAMS.GERAL || []; }
function desenharEnc() {

function encProduto(i) { PICK = { i: null, cb: function (lab, ref) { var l = EN.linhas[i]; l.produto = lab; l.ref = ref; l.cor = ''; l.tam = ''; desenharEnc(); } }; abrirModal(); }
function encOutroTam(i) { var l = EN.linhas[i]; EN.linhas.splice(i + 1, 0, { produto: l.produto, ref: l.ref, cor: l.cor, tam: '', qtd: '', nota: l.nota }); desenharEnc(); }
function encGuardar(enviar) {
  var ls = EN.linhas.filter(function (l) { return l.produto && Number(l.qtd) > 0; });
  if (!ls.length) { msg('Falta pelo menos um artigo com quantidade.', true); return; }
  var semTam = ls.filter(function (l) { return !l.cor || !l.tam; }).length;
  if (semTam && !confirm(semTam + ' linha(s) sem cor ou sem tamanho. Continuar?')) return;

  call('apiEncGuardar', { num: EN.num, forn: EN.forn, obs: EN.obs, data: EN.data, linhas: ls.map(function (l) { return { produto: l.produto, cor: l.cor, tam: l.tam, qtd: Number(l.qtd), nota: l.nota || '' }; }) }, !!enviar)
    .then(function (r) { msg('Encomenda ' + r.num + ' guardada (' + r.linhas + ' linhas, ' + eur(r.total) + ' s/IVA)' + (r.enviada ? '\nEnviada para ' + r.email : '')); abrirEnc(r.num); });
}
function encMarcar() {

}
function encPdf(num) {
  call('apiEncPdf', num).then(function (r) {
    var bin = atob(r.b64), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([a], { type: 'application/pdf' })), l = document.createElement('a');
    l.href = url; l.download = r.nome; l.target = '_blank'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  });
}

function fdPeca(x, p, s, y0) {
  var im = FD.itens[p.k].im, px = p.x * s, py = (p.y - y0) * s, w = p.w * s, hh = p.h * s;
  x.save();
  if (p.r) { x.translate(px + w, py); x.rotate(Math.PI / 2); x.drawImage(im, 0, 0, hh, w); } else x.drawImage(im, px, py, w, hh);
  x.restore();
}
function fdPreview() {
  var cv = $('fdCv'), res = FD.res; if (!cv || !res) return;
  var W = Number(DTF.rolo) || 55, larg = cv.parentNode.clientWidth - 28 || 300, s = Math.min(larg / W, 2400 / Math.max(res.comp, 1));
  cv.width = Math.round(W * s); cv.height = Math.max(20, Math.round(res.comp * s)); cv.style.width = cv.width + 'px';
  var x = cv.getContext('2d');
  res.ps.forEach(function (p) { x.strokeStyle = '#c3cad8'; x.strokeRect(p.x * s + 0.5, p.y * s + 0.5, p.w * s - 1, p.h * s - 1); fdPeca(x, p, s, 0); });
  x.strokeStyle = '#C0392B'; x.fillStyle = '#C0392B'; x.font = '11px Arial'; x.setLineDash([6, 4]);
  for (var m = 100; m < res.comp; m += 100) { var y = m * s; x.beginPath(); x.moveTo(0, y); x.lineTo(cv.width, y); x.stroke(); x.fillText(m / 100 + ' m', 4, y - 3); }
  x.setLineDash([]);
}
function fdExportar() {
  var res = FD.res; if (!res) return;
  var ppc = FD.dpi / 2.54, Wpx = Math.round(DTF.rolo * ppc), maxCm = Math.min(100, Math.floor(16000000 / Wpx) / ppc), segs = [], cur = null;
  res.prat.forEach(function (s) {
    if (!cur || s.y + s.h - cur.y0 > maxCm) { cur = { y0: s.y, y1: s.y + s.h }; segs.push(cur); } else cur.y1 = s.y + s.h;
  });
  if (segs.some(function (g) { return g.y1 - g.y0 > maxCm + 1e-6; })) { msg('A ' + FD.dpi + ' dpi há uma fila demasiado alta para o telemóvel. Escolhe menos dpi.', true); return; }
  segs.forEach(function (sg, n) {
    setTimeout(function () {
      var c = document.createElement('canvas'); c.width = Wpx; c.height = Math.round((sg.y1 - sg.y0) * ppc);
      var x = c.getContext('2d');
      res.ps.forEach(function (p) { if (p.y >= sg.y0 - 1e-6 && p.y < sg.y1 - 1e-6) fdPeca(x, p, ppc, sg.y0); });
      c.toBlob(function (b) {
        var a = document.createElement('a'); a.href = URL.createObjectURL(b);
        a.download = 'Folha DTF ' + (n + 1) + ' de ' + segs.length + ' - ' + DTF.rolo + 'x' + Math.ceil(sg.y1 - sg.y0) + ' cm ' + FD.dpi + 'dpi.png';
        document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 60000);
      }, 'image/png');
    }, n * 1500);
  });
  msg(segs.length + ' ficheiro(s) PNG a ' + FD.dpi + ' dpi.');
}

  }).join('');
  h += '<button class="btn sec" style="width:100%" onclick="empAdd()">＋ Artigo</button>' +
    '<div class="acts"><button class="btn ok" onclick="guardarEmp()"' + (e.itens.length ? '' : ' disabled') + '>Registar empréstimo</button><button class="btn sec" onclick="EN2=null;$(\'empForm\').innerHTML=\'\'">Cancelar</button></div>';
  $('empForm').innerHTML = h;
}
function empAdd() {
  PICK = { i: null, cb: function (lab, ref) {
    var corStock = (D.cores[base(ref)] || []).filter(function (c) { return c.indexOf(STK) === 0; })[0];
    EN2.itens.push({ produto: lab, ref: ref, cor: corStock ? limpaCor(corStock) : '', tam: '', qtd: 1 }); desenharNovoEmp();
  } };
  abrirModal();
}
function empKit(i) {
  var l = EN2.itens[i], ts = tamanhosDe(l.ref);
  EN2.itens.splice.apply(EN2.itens, [i, 1].concat(ts.map(function (t) { return { produto: l.produto, ref: l.ref, cor: l.cor, tam: t, qtd: 1 }; })));
  desenharNovoEmp();
}
function guardarEmp() {
  var e = EN2, c = $('emCli'); if (c) { e.cliente = c.value.trim(); var cc = cliPorNome(e.cliente); if (cc) e.nif = cc[1]; }
  if (!e.cliente) { msg('Indica o cliente.', true); return; }
  var its = e.itens.filter(function (l) { return Number(l.qtd) > 0; });
  if (!its.length) { msg('Falta pelo menos um artigo com quantidade.', true); return; }
  var semCor = its.filter(function (l) { return !l.cor; }).length;
  if (semCor && !confirm(semCor + ' artigo(s) sem cor — esses não saem do stock. Continuar?')) return;
  call('apiEmprestimoNovo', { cliente: e.cliente, nif: e.nif, devolver: e.devolver, notas: e.notas,
    itens: its.map(function (l) { return { produto: l.produto, ref: l.ref, cor: l.cor, tam: l.tam, qtd: Number(l.qtd) }; }) })
    .then(function (r) { msg('Empréstimo ' + r.id + ' registado (' + r.itens + ' linha(s)). As peças saíram do stock.'); EN2 = null; STOCK = null; irEmprestimos(ECLI); });
}

// ---------------- stock ----------------
var SBUSCA = '';
function irStock() {
  navOn('n-res'); $('titulo').textContent = 'Stock';
  if (!STOCK) call('apiStock').then(function (s) { STOCK = s; desenharStock(); }); else desenharStock();
}
function desenharStock() {
  $('main').innerHTML = '<input placeholder="Procurar referência, produto ou cor…" value="' + esc(SBUSCA) + '" oninput="SBUSCA=this.value;itensStock()"><div style="height:8px"></div><div id="sItens"></div>';
  itensStock();
}
function itensStock() {
  var q = norm(SBUSCA), g = null, h = '';
  var l = STOCK.filter(function (s) { return !q || norm(s.ref + ' ' + s.produto + ' ' + s.cor).indexOf(q) >= 0; });
  l.forEach(function (s) {
    if (s.grupo !== g) { if (g !== null) h += '</div>'; g = s.grupo; h += '<h2>' + esc(g) + '</h2><div class="card">'; }
    h += '<div class="lin"><div class="row"><div class="sp"><div class="b">' + esc(s.ref) + ' · ' + esc(s.cor) + '</div><div class="mut">' + esc(s.produto) +
      ' · comprado ' + s.comp + ' · vendido ' + s.vend + '</div></div><div class="b num ' + (s.stock > 0 ? 'stk' : 'mut') + '" style="font-size:16px">' + s.stock + '</div></div></div>';
  });
  $('sItens').innerHTML = l.length ? h + '</div>' : '<div class="vazio">Sem stock registado. As compras lançam-se na aba Proformas.</div>';
}

iniciar();
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
